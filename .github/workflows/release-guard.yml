# Release guard for kgbearcat/kestrel-releases (D-869). Installed as .github/workflows/release-guard.yml in that repo, next to
# .github/release-guard/release_guard.py. Source of truth: tools/release/github-guard/ in the Kestrel app repo.
#
# On publish: a Kestrel release (tag v1.2.3) that is missing a valid signed update-trust.stable.txt, or whose trust file does not
# match its package or tag, is turned back into a draft and this run fails. Picture-pack and other tags are left alone.
# Daily: the Latest release is checked (never changed) and the run fails when its trust file has under 30 days left.
name: Release guard

on:
  release:
    types: [published]
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write   # needed to turn a broken release back into a draft; nothing else

concurrency:
  group: release-guard-${{ github.event.release.id || 'audit' }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2, pinned by commit
        with:
          sparse-checkout: .github/release-guard
          persist-credentials: false
      - name: Check the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I .github/release-guard/release_guard.py
